name: Build and Release Plasmoid

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Next Version
        id: versioning
        run: |
          git fetch --tags --force 2>/dev/null || true
          
          # Find highest v1.X tag
          LATEST_TAG=$(git tag -l "v1.*" | sort -V | tail -n 1)
          echo "Latest tag found: '$LATEST_TAG'"
          
          if [ -z "$LATEST_TAG" ]; then
            MINOR=0
          else
            CURRENT_MINOR=$(echo "$LATEST_TAG" | sed -E 's/^v?1\.//')
            MINOR=$((CURRENT_MINOR + 1))
          fi
          
          NEW_VERSION="1.${MINOR}"
          NEW_TAG="v1.${MINOR}"
          
          echo "New Version: $NEW_VERSION"
          echo "New Tag: $NEW_TAG"
          
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

      - name: Update Version in metadata.json
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          python3 -c "
          import json
          with open('metadata.json', 'r') as f:
              data = json.load(f)
          data['KPlugin']['Version'] = '$VERSION'
          with open('metadata.json', 'w') as f:
              json.dump(data, f, indent=4)
          "
          echo "Updated metadata.json to version $VERSION"

      - name: Package Plasmoid
        run: |
          VERSION="${{ steps.versioning.outputs.version }}"
          PACKAGE_NAME="org.scyan.screenmanager-v${VERSION}.plasmoid"
          
          # Package the plasmoid files into a .plasmoid zip archive
          zip -r "$PACKAGE_NAME" metadata.json contents/
          
          # Generic copy for permalink convenience
          cp "$PACKAGE_NAME" org.scyan.screenmanager.plasmoid
          
          ls -lh *.plasmoid

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: "Release ${{ steps.versioning.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            org.scyan.screenmanager-v${{ steps.versioning.outputs.version }}.plasmoid
            org.scyan.screenmanager.plasmoid
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
